services:
  - type: web
    name: fundamenta-api
    runtime: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: /app/.venv/bin/python -m app.runtime api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fundamenta-postgres
          property: connectionString
      - key: BOOTSTRAP_ON_START
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/fundamenta-avatars
      - key: NOTES_SYNC_IN_API_ON_START
        value: "true"
      - key: NOTES_SYNC_ON_START
        value: "true"
      - key: NOTES_SYNC_TIMEZONE
        value: America/Lima

databases:
  - name: fundamenta-postgres
    region: oregon
    plan: free
    postgresMajorVersion: "17"
    databaseName: fundamenta
    user: fundamenta
    ipAllowList: []
